version: 2

models:
  - name: mart_meat_price_analysis
    description: "Final curated table for analyzing meat price changes during avian flu outbreaks"
    columns:
      - name: date
        description: "Month of the observation in YYYY-MM format"
      - name: egg_price
        description: "Average retail price of eggs in USD"
      - name: egg_change
        description: "Month-over-month change in egg price"
      - name: chicken__boneless_breast
        description: "Average retail price of boneless chicken breast in USD"
      - name: chicken_change
        description: "Month-over-month change in chicken breast price"
      - name: pork_price
        description: "Average retail price of pork in USD"
      - name: pork_change
        description: "Month-over-month change in pork price"
      - name: beef_price
        description: "Average retail price of beef in USD"
      - name: beef_change
        description: "Month-over-month change in beef price"
      - name: outbreak_status
        description: "Label indicating if an avian flu outbreak occurred during the month"
      - name: outbreaks
        description: "Total number of avian flu outbreaks reported in the month"
      - name: flock_size
        description: "Total number of birds affected by avian flu outbreaks during the month"
